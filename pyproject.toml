[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obscript"
version = "0.1.0"
description = "Composable Agent-powered video rescripting pipeline"
requires-python = ">=3.11"

[project.scripts]
obscript = "obscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
